name: MemeCloud CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/memecloud_ci
      REDIS_URL: redis://127.0.0.1:6379
      EXECUTION_MODE: simulation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm verify:live-safety
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
