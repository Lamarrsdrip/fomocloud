name: MemeCloud CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/memecloud_ci?replicaSet=rs0
      REDIS_URL: redis://127.0.0.1:6379
      EXECUTION_MODE: simulation

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Initialize Mongo replica set
        run: |
          docker exec $(docker ps -q --filter ancestor=mongo:7) \
            mongosh --quiet --eval \
            'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}) }'

          for i in {1..30}; do
            if mongosh --quiet --host 127.0.0.1:27017 \
              --eval 'db.hello().isWritablePrimary' | grep -q true; then
              echo "Mongo replica set ready"
              break
            fi
            sleep 2
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm verify:live-safety
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
